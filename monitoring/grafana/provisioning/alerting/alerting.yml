apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email-financeiro
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}

policies:
  - orgId: 1
    receiver: email
    group_by: [alertname]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: financeiro
    folder: Financeiro
    interval: 30s
    rules:
      - uid: financeiro-app-down
        title: AppForaDoAr
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical, service: financeiro}
        annotations:
          summary: O Prometheus não consegue coletar as métricas do app há 1 minuto.
          runbook: Veja `docker compose ps` / `kubectl get pods` e os logs do app.
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model: {refId: A, expr: 'min(up{job="financeiro-app"})', instant: true}
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}

      - uid: financeiro-high-errors
        title: TaxaDeErros5xxAlta
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical, service: financeiro}
        annotations:
          summary: Mais de 5% das requisições estão retornando 5xx.
          runbook: Veja os logs do app e a conexão com o banco.
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[2m])) / sum(rate(django_http_responses_total_by_status_total[2m]))'
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0.05]}}]}

      - uid: financeiro-high-latency
        title: LatenciaP95Alta
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning, service: financeiro}
        annotations:
          summary: A latência p95 passou de 1 segundo.
          runbook: Veja CPU/memória dos containers e a latência do banco.
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le) (rate(django_http_requests_latency_seconds_by_view_method_bucket[2m])))'
          - refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [1]}}]}
