{% extends "_layouts.html" %}
{% load django_bootstrap5 %}

{% block head_title %}
  {{ titulo }}
{% endblock head_title %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-4 shadow" style="width: 400px; max-width: 100%;">
            <h2 class="text-center mb-4">{{ titulo }}</h2>
            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}
                <button type="submit" class="btn btn-primary w-100 mt-3">Salvar</button>
                <a href="{% url 'contas_list' %}" class="d-flex justify-content-center mt-3">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock content %}
