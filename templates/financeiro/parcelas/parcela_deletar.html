{% extends "_layouts.html" %}
{% load django_bootstrap5 %}

{% block head_title %}
  Excluir Parcela
{% endblock head_title %}

{% block content %}
<div class="container mt-4">
  <h2>Excluir Parcela</h2>
  <p>Tem certeza que deseja excluir a parcela <strong>{{ parcela.descricao }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'parcelas_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
