# Ambiente da aplicação: Django (Gunicorn) + MariaDB
#
# Uso:
#   docker compose up -d --build     # sobe tudo em segundo plano
#   docker compose ps                # status dos serviços
#   docker compose logs -f web       # logs da aplicação
#   docker compose down              # para e remove containers e redes
#   docker compose down -v           # remove também o volume do banco
#
# Todas as variáveis têm valor padrão (${VAR:-padrao}); para sobrescrever,
# crie um arquivo .env na raiz do projeto (ele já é ignorado pelo git).

x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,.app.github.dev}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://*.app.github.dev,http://localhost:8000}
  DB_ENGINE: django.db.backends.mysql
  DB_NAME: ${DB_NAME:-gerenciador_financeiro}
  DB_USER: ${DB_USER:-financeiro}
  DB_PASSWORD: ${DB_PASSWORD:-financeiro123}
  DB_HOST: db          # nome do serviço = hostname no DNS interno do Compose
  DB_PORT: "3306"

services:
  # Banco de dados (MariaDB é compatível com MySQL e com o mysqlclient da imagem)
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-gerenciador_financeiro}
      MARIADB_USER: ${DB_USER:-financeiro}
      MARIADB_PASSWORD: ${DB_PASSWORD:-financeiro123}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Container "one-shot": aplica as migrações e encerra
  migrate:
    image: gerenciador-financeiro:latest
    build: .
    command: python manage.py migrate --noinput
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  # Aplicação Django servida pelo Gunicorn (imagem do Dockerfile da atividade anterior)
  web:
    image: gerenciador-financeiro:latest
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend

volumes:
  mariadb_data:

networks:
  # O banco fica só na rede backend: não é acessível a partir da frontend
  frontend:
    driver: bridge
  backend:
    driver: bridge
