name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ci_db.sqlite3
      DB_USER: ci
      DB_PASSWORD: ci

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências do sistema (mysqlclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: python manage.py test

      - name: Build (collectstatic)
        run: python manage.py collectstatic --noinput

  # Testes de integração: roda a suíte dentro da imagem Docker contra um MariaDB real
  docker-compose-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir a imagem e iniciar o banco
        run: |
          docker compose -f docker-compose.test.yml build
          docker compose -f docker-compose.test.yml up -d --wait db
          docker compose -f docker-compose.test.yml ps

      - name: Executar testes no container
        run: docker compose -f docker-compose.test.yml run --rm tests

      - name: Subir o compose principal (smoke test)
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl --fail --silent -o /dev/null http://localhost:8000/ && break
            sleep 2
          done
          docker compose ps -a
          curl --fail --silent --show-error -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8000/

      - name: Exibir logs em caso de falha
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml logs
          docker compose logs

      - name: Parar os serviços
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
          docker compose down -v
