apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels: {app: mariadb}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mariadb}
  template:
    metadata:
      labels: {app: mariadb}
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom: {secretKeyRef: {name: financeiro-secret, key: DB_NAME}}
            - name: MARIADB_USER
              valueFrom: {secretKeyRef: {name: financeiro-secret, key: DB_USER}}
            - name: MARIADB_PASSWORD
              valueFrom: {secretKeyRef: {name: financeiro-secret, key: DB_PASSWORD}}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: financeiro-secret, key: MARIADB_ROOT_PASSWORD}}
          readinessProbe:
            exec: {command: ["healthcheck.sh", "--connect", "--innodb_initialized"]}
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 512Mi, cpu: 500m}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mariadb-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  selector: {app: mariadb}
  ports:
    - port: 3306
