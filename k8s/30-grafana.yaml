cat > k8s/30-grafana.yaml <<'EOF'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef: {name: grafana-secret}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dash-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting}
            - {name: dash-json, mountPath: /var/lib/grafana/dashboards}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 512Mi, cpu: 500m}
      volumes:
        - {name: datasources, configMap: {name: grafana-datasources}}
        - {name: dash-provider, configMap: {name: grafana-dashboards-provider}}
        - {name: alerting, configMap: {name: grafana-alerting}}
        - {name: dash-json, configMap: {name: grafana-dashboard-json}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector: {app: grafana}
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
EOF