cat > k8s/00-app.yaml <<'EOF'
apiVersion: v1
kind: Secret
metadata:
  name: financeiro-secret
type: Opaque
stringData:
  SECRET_KEY: chave-de-desenvolvimento-troque-em-producao
  DB_NAME: gerenciador_financeiro
  DB_USER: financeiro
  DB_PASSWORD: financeiro123
  MARIADB_ROOT_PASSWORD: root123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: financeiro-config
data:
  DB_HOST: mariadb
  DB_PORT: "3306"
  DEBUG: "False"
  CSRF_TRUSTED_ORIGINS: http://localhost:8080,https://*.app.github.dev
---
apiVersion: batch/v1
kind: Job
metadata:
  name: financeiro-migrate
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: gerenciador-financeiro:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef: {name: financeiro-config}
            - secretRef: {name: financeiro-secret}
          env:
            - {name: ALLOWED_HOSTS, value: localhost}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financeiro-app
  labels: {app: financeiro}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: financeiro}
  template:
    metadata:
      labels: {app: financeiro}
    spec:
      containers:
        - name: web
          image: gerenciador-financeiro:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: financeiro-config}
            - secretRef: {name: financeiro-secret}
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: ALLOWED_HOSTS
              value: localhost,127.0.0.1,$(POD_IP),financeiro-service,.app.github.dev
          readinessProbe:
            httpGet: {path: /, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 384Mi, cpu: 500m}
---
apiVersion: v1
kind: Service
metadata:
  name: financeiro-service
spec:
  type: NodePort
  selector: {app: financeiro}
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
EOF